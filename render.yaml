databases:
  - name: estatepulse-db
    databaseName: estatepulse
    user: estatepulse_user
    plan: free

services:
  # 1. FastAPI Backend (Web Service)
  - type: web
    name: estatepulse-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: estatepulse-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"

  # 2. React 18 + Vite Frontend (Render Static Site - Free)
  - type: static
    name: estatepulse-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: estatepulse-backend
          property: host
